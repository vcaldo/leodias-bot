# Minimal New Relic agent config. All real values come from environment
# variables (NEW_RELIC_LICENSE_KEY, NEW_RELIC_APP_NAME, etc), which take
# precedence over this file — nothing sensitive is hardcoded here.
[newrelic]
app_name = transcribe-api
monitor_mode = true
log_level = info
distributed_tracing.enabled = true
transaction_tracer.enabled = true
error_collector.enabled = true
